name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs only; every push to main gets its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Two jobs run in parallel:
# - checks needs no environment variables: unit tests don't import
#   api/src/env.ts (which requires DATABASE_URL), and the builds don't run any
#   code that reads it. VITE_MAPTILER_API_KEY is only inlined into the web
#   bundle, which CI discards.
# - e2e runs the full Playwright suite against a Postgres service container.
#   It needs the VITE_MAPTILER_API_KEY repository secret (a CI-specific key)
#   and fails straight away without it. GitHub doesn't pass secrets to
#   pull requests from forks, so e2e fails on those; that's accepted here.

jobs:
  checks:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          # Nothing later needs git auth; keep the token away from install scripts.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
            web/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install api dependencies
        run: npm ci --prefix api

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test api
        run: npm test --prefix api

      - name: Test web
        run: npm test --prefix web

      - name: Build api
        run: npm run build --prefix api

      - name: Build web
        run: npm run build --prefix web

  e2e:
    name: End-to-end tests
    # Pinned: Playwright 1.60 can't install Chromium on ubuntu-latest (now 26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        # Same version as docker-compose.yml.
        image: postgres:17
        env:
          POSTGRES_USER: geogames
          POSTGRES_PASSWORD: geogames
          POSTGRES_DB: geogames
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geogames -d geogames"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # There's no .env in CI. e2e/support/resetDb.ts drops and recreates this
      # database (the name must end in _e2e), and playwright.config.ts hands it
      # to the api server as DATABASE_URL.
      E2E_DATABASE_URL: postgres://geogames:geogames@localhost:5432/geogames_e2e
    steps:
      - name: Check the MapTiler key is set
        env:
          VITE_MAPTILER_API_KEY: ${{ secrets.VITE_MAPTILER_API_KEY }}
        run: |
          if [ -z "$VITE_MAPTILER_API_KEY" ]; then
            echo "::error::VITE_MAPTILER_API_KEY secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Check out code
        uses: actions/checkout@v7
        with:
          # Nothing later needs git auth; keep the token away from install scripts.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
            web/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install api dependencies
        run: npm ci --prefix api

      - name: Install web dependencies
        run: npm ci --prefix web

      # Not cached: Playwright advises against it, as restoring the cache
      # takes about as long as downloading, and the OS deps need installing
      # anyway.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        id: e2e
        env:
          # The web dev server that Playwright starts reads it from the environment.
          VITE_MAPTILER_API_KEY: ${{ secrets.VITE_MAPTILER_API_KEY }}
        run: npx playwright test

      # The report's traces include MapTiler request URLs, so they contain the
      # key. That key is already public in the web bundle, and the artifact is
      # private to the repo and kept for 7 days.
      - name: Upload Playwright report
        if: ${{ failure() && steps.e2e.conclusion == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
