services:
  postgres:
    image: postgres:17
    container_name: geogames-postgres
    environment:
      POSTGRES_USER: geogames
      POSTGRES_PASSWORD: geogames
      POSTGRES_DB: geogames
    ports:
      - "5432:5432"
    volumes:
      - geogames-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geogames -d geogames"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  geogames-postgres:
